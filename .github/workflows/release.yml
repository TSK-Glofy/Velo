name: Release

# 只有手动触发。普通 commit 不碰 CI —— 这是明确要求，不要加 push / pull_request。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "裸版本号，不带 v 前缀，例如 0.13.0"
        type: string
        required: true
      mode:
        description: "build-only=只试打包不动仓库 / draft=发草稿 / publish=直接公开"
        type: choice
        required: true
        default: build-only
        options:
          - build-only
          - draft
          - publish

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    # version 从不直接插进 shell 命令，一律经 env 传入：表达式插值会在 shell
    # 解析前做字符串替换，直接拼进 run: 等于把输入当代码执行。
    env:
      VERSION: ${{ inputs.version }}
      MODE: ${{ inputs.mode }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      MSI_EN: src-tauri/target/release/bundle/msi/velo_${{ inputs.version }}_x64_en-US.msi
      MSI_ZH: src-tauri/target/release/bundle/msi/velo_${{ inputs.version }}_x64_zh-CN.msi
      SETUP_EXE: src-tauri/target/release/bundle/nsis/velo_${{ inputs.version }}_x64-setup.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 version 输入
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version 必须形如 0.13.0（裸 semver，不带 v 前缀），收到的是 '$VERSION'"
            exit 1
          fi
          echo "版本 $VERSION，模式 $MODE"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 整条流水线都依赖 set-version.mjs 和 release-notes.mjs 正确；它们的测试
      # 只要几秒，而一次构建要十几分钟，先跑测试划算得多。
      - name: 跑 node 测试
        run: npm run test:node

      # 覆盖 config.rs 与 paths.rs 的 38 个测试 —— 正是「发版把用户数据搞丢」
      # 这条反目标所保护的文件。试打包不需要这道闸门，发版需要。
      - name: 跑 Rust 测试
        if: inputs.mode != 'build-only'
        working-directory: src-tauri
        run: cargo test

      # ---- 发布前置校验：全部排在改动任何文件之前，不过就什么痕迹都不留 ----
      - name: 发布前置校验
        if: inputs.mode != 'build-only'
        shell: bash
        run: |
          # 用 Actions 内置的 $GITHUB_REF_NAME，不走表达式插值 —— 同样是避免把
          # 外部值拼进 shell 代码（分支名允许包含 shell 元字符）。
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::$MODE 模式只能从 main 跑，当前分支是 $GITHUB_REF_NAME"
            exit 1
          fi

          # release notes 必须存在且能抽出非空的英文正文，否则会发出空白 Release
          node scripts/release-notes.mjs "$VERSION" > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::docs/release-notes/v$VERSION.md 抽不出英文正文"
            exit 1
          fi
          echo "Release 正文 $(wc -l < release-body.md) 行，预览："
          head -5 release-body.md

          # tag 已存在时，按「有没有 Release、是不是草稿、当前什么模式」分情形
          # 给出不同指引。关键是别把用户推去手动删 tag —— 那正是这条流水线要
          # 消灭的手工活，而多数情况下正确动作根本不是删。
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            HAS_RELEASE=false
            IS_DRAFT=false
            if gh release view "$TAG" >/dev/null 2>&1; then
              HAS_RELEASE=true
              if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
                IS_DRAFT=true
              fi
            fi

            if [ "$HAS_RELEASE" = true ] && [ "$IS_DRAFT" != true ]; then
              echo "::error::$TAG 的 Release 已经发布。已发布的版本不能覆盖 —— 要重发请先手动删掉远端 tag 和它的 Release。"
              exit 1
            fi

            if [ "$MODE" = "publish" ]; then
              if [ "$IS_DRAFT" = true ]; then
                echo "::error::$TAG 已经有一个草稿 Release 了。要把它正式发出去，到 GitHub 的 Release 页面点一下 Publish 即可，不必重跑这条流水线；只有想换掉草稿内容时才重跑 draft 模式。"
              else
                echo "::error::tag $TAG 已在远端但还没有 Release（上次大概挂在建 Release 这一步）。用 draft 模式重跑可以自动补齐，然后在网页上点 Publish。"
              fi
              exit 1
            fi

            if [ "$HAS_RELEASE" = true ]; then
              echo "$TAG 已有草稿 Release，本次将覆盖它"
            else
              echo "$TAG 的 tag 在远端但没有对应 Release，本次补齐"
            fi
          fi

      - name: 同步 6 处版本号
        shell: bash
        run: node scripts/set-version.mjs "$VERSION"

      # set-version 自己的「锚点必须命中一次」是第一道闸门；这里是最后一道 ——
      # 万一将来有人重构 settings.ts 时把锚点契约也改坏了，只有这里能在
      # commit 之前拦住一个版本号不一致的状态。
      - name: 反向校验 6 处版本号
        shell: bash
        run: node scripts/set-version.mjs --verify "$VERSION"

      # ---- 编译。刻意排在所有 git 写操作之前：编译失败时仓库零痕迹，重跑即可。
      #      反过来先 push 再编译，一挂就在 main 上留个没有 Release 的悬空 tag。----
      - name: 构建 en-US MSI
        run: npm run build:msi:en

      - name: 构建 zh-CN MSI
        run: npm run build:msi:zh

      - name: 构建 NSIS setup.exe
        run: npm run build:nsis

      # 三种模式都挂到运行记录上。发版模式下这看着和 Release assets 重复，但
      # 「建 Release」那一步失败时，它是十几分钟构建成果的唯一去处。
      #
      # 按确切文件名上传，不用通配符：bundle/ 目录不会被清理，通配符有扫到陈旧
      # 产物的风险；写死文件名 + if-no-files-found: error 还能让「某个包没打出来」
      # 直接变成构建失败，而不是悄悄发一个少了附件的 Release。
      - name: 挂到本次运行记录
        uses: actions/upload-artifact@v4
        with:
          name: velo-${{ inputs.version }}-installers
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.MSI_EN }}
            ${{ env.MSI_ZH }}
            ${{ env.SETUP_EXE }}

      - name: 确认 3 个安装包都在
        if: inputs.mode != 'build-only'
        shell: bash
        run: |
          for f in "$MSI_EN" "$MSI_ZH" "$SETUP_EXE"; do
            if [ ! -f "$f" ]; then
              echo "::error::没有产出 $f"
              exit 1
            fi
            echo "$f  $(du -h "$f" | cut -f1)"
          done

      - name: 提交版本号改动并打 tag
        if: inputs.mode != 'build-only'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 只暂存这 6 个文件。构建会改写被跟踪的 src-tauri/installer/install.json
          # （打完会还原，但窗口存在），前置校验还在工作区留了 release-body.md，
          # git add -A 会把它们一起卷进发布 commit。
          git add package.json package-lock.json \
                  src-tauri/Cargo.toml src-tauri/Cargo.lock \
                  src-tauri/tauri.conf.json src/settings.ts

          if git diff --cached --quiet; then
            echo "6 处版本号本来就是 $VERSION，没有改动可提交 —— 直接给当前 HEAD 打 tag"
          else
            git commit -m "chore: release $TAG"
            echo "已提交版本号改动"
          fi

          git push origin HEAD:main

          TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          HEAD_COMMIT="$(git rev-parse HEAD)"

          if [ "$TAG_COMMIT" = "$HEAD_COMMIT" ]; then
            # 重跑且什么都没变。git tag -f -a 每次都会生成新的 annotated tag 对象、
            # 让 ref 的 SHA 变掉，已 fetch 过它的人下次就得 --force；这里不动它。
            echo "tag $TAG 已指向本次构建的 commit，保持不动"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            # 只有 draft 能走到这里（publish 已在前置校验被挡），但那次检查距此
            # 隔了三次构建，所以就地再守一次。
            if [ "$MODE" != "draft" ]; then
              echo "::error::$MODE 模式不允许移动已有的 tag $TAG"
              exit 1
            fi
            echo "tag $TAG 指向别处，对齐到本次构建的 commit"
            git tag -f -a "$TAG" -m "Velo $TAG"
            git push --force origin "refs/tags/$TAG"
          else
            git tag -a "$TAG" -m "Velo $TAG"
            git push origin "refs/tags/$TAG"
          fi

          echo "::notice::main 上可能多了一个版本号 commit —— 本地动手前记得先 git pull"

      - name: 建 Release 并传包
        if: inputs.mode != 'build-only'
        shell: bash
        run: |
          # 就地复查，不信任十几分钟前那次前置校验：三次构建期间，用户完全可能
          # 去把上一个草稿点了 Publish。检查必须和它守护的动作相邻。
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$MODE" != "draft" ]; then
              echo "::error::$TAG 已经有 Release，而当前是 $MODE 模式 —— 拒绝覆盖"
              exit 1
            fi
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::$TAG 的 Release 已经发布，拒绝覆盖。要重发请先手动删掉它"
              exit 1
            fi
            gh release delete "$TAG" --yes
            echo "已删除 $TAG 的旧草稿 Release"
          fi

          DRAFT_FLAG=()
          if [ "$MODE" = "draft" ]; then
            DRAFT_FLAG=(--draft)
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-body.md \
            "${DRAFT_FLAG[@]}" \
            "$MSI_EN" "$MSI_ZH" "$SETUP_EXE"

          echo "完成：$(gh release view "$TAG" --json url -q .url)"
